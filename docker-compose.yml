version: '3.8'

networks:
  tecnorosita-net:
    driver: bridge

volumes:
  db_data:

services:
  db:
    image: mysql:8.0
    container_name: tecnorosita_mysql
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: tecnorosita_v2
    ports:
      - "1404:3306"
    networks:
      - tecnorosita-net
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: .
    container_name: tecnorosita_backend
    restart: on-failure
    depends_on:
      - db
    ports:
      - "1405:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3307/tecnorosita_v2?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - tecnorosita-net

  frontend:
    build:
      context: ../TecnoRosita-Duoc-main/frontend
    container_name: tecnorosita_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "1406:80"
    networks:
      - tecnorosita-net

