version: '3.8'

networks:
  tecnorosita-net:
    driver: bridge

services:
  # 1. Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: tecnorosita_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tecnorosita_db
    ports:
      - "3306:3306"
    networks:
      - tecnorosita-net
    volumes:
      - db_data:/var/lib/mysql

  # 2. Backend (Spring Boot)
  backend:
    build:
      context: .
    container_name: tecnorosita_backend
    restart: on-failure
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/tecnorosita_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - tecnorosita-net


  frontend:
    build:

      context: ../TecnoRosita-Duoc-main/frontend
    container_name: tecnorosita_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - tecnorosita-net

volumes:
  db_data:

    

